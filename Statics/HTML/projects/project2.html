<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project 2</title>
    <link rel="stylesheet" href="../../CSS/project2.css" />
</head>
<body>
    <nav>
        <a id="nameLink" href="../../../index.html">Erick Cedillo</a>
        <button id="menuToggle" class="menuToggle" type="button" aria-expanded="false" aria-controls="buttons" aria-label="Toggle navigation menu">☰</button>
        <div id="buttons">
            <a id="navBack" class="navLink" href="../../../index.html#projects">Back</a>
            <span id="langLabel">Language:</span>
            <button id="enBtn" class="langBtn" type="button">EN</button>
            <button id="esBtn" class="langBtn" type="button">ES</button>
            <div id="themeLabel">
                <span id="themeText">Dark Mode</span>
                <label class="toggleSwitch" for="themeToggle">
                    <input type="checkbox" id="themeToggle" />
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </nav>

    <main>
        <section class="hero">
            <h1 id="pageTitle">Sistema de control de puente movil</h1>
            <p id="pageSubtitle">A physically built, laser-cut drawbridge controlled by a Raspberry Pi 5 — winner of the Interprepas competition.</p>
            <div class="heroActionsRow">
                <a id="backHomeBtn" class="primaryBtn" href="../../../index.html#projects">Back to projects</a>
                <a class="primaryBtn" href="https://github.com/CiscoHD/Interprepas_MainWhile/tree/main/ElectronicProjects" target="_blank" rel="noopener noreferrer">View GitHub Repository</a>
            </div>
        </section>

        <section id="overview">
            <h2 id="sectionOverviewTitle">Overview</h2>
            <div class="sectionSplit">
                <p id="sectionOverviewText"></p>
                <figure class="mediaCard">
                    <video autoplay loop muted playsinline preload="metadata" aria-label="Project 2 overview preview">
                        <source src="../../../Media/Videos/Project2-1.mp4" type="video/mp4" />
                    </video>
                </figure>
            </div>
        </section>

        <section id="stack">
            <h2 id="sectionStackTitle">Stack</h2>
            <div class="sectionSplit">
                <ul id="stackList"></ul>
                <figure class="mediaCard">
                    <img src="../../../Media/Images/project2-3.jpg" alt="Project 2 hardware detail" loading="lazy" />
                </figure>
            </div>
        </section>

        <section id="impact">
            <h2 id="sectionImpactTitle">Impact</h2>
            <div class="sectionSplit">
                <figure class="mediaCard">
                    <video autoplay loop muted playsinline preload="metadata" aria-label="Project 2 achievements preview">
                        <source src="../../../Media/Videos/Project2-2.mp4" type="video/mp4" />
                    </video>
                </figure>
                <ul id="impactList"></ul>
            </div>
        </section>
    </main>

    <script src="../../../Dinamics/JS/project2.js"></script>
    <script src="../../../Dinamics/JS/project-base.js"></script>
</body>
</html>
